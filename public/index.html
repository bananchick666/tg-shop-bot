<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Магазин</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <button class="header-btn back-btn" id="backBtn" style="visibility: hidden;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1 class="header-title" id="headerTitle">🛍 Магазин</h1>
            <button class="header-btn cart-btn" id="cartBtn">
                <span class="cart-icon-wrapper">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
                </span>
            </button>
        </header>

        <!-- Контент -->
        <main class="content" id="content">
            <!-- Категории (начальный экран) -->
            <div class="view" id="view-categories">
                <div class="categories-grid">
                    <div class="category-card" data-category="shoes" onclick="showProducts('shoes')">
                        <div class="category-icon">👟</div>
                        <h2 class="category-name">Обувь</h2>
                        <p class="category-desc">Nike, Adidas, Vans, New Balance</p>
                        <span class="category-count">17 товаров</span>
                    </div>
                    <div class="category-card" data-category="tech" onclick="showProducts('tech')">
                        <div class="category-icon">🎧</div>
                        <h2 class="category-name">Техника</h2>
                        <p class="category-desc">Наушники, геймпады</p>
                        <span class="category-count">2 товара</span>
                    </div>
                </div>
            </div>

            <!-- Список товаров -->
            <div class="view" id="view-products" style="display: none;">
                <div class="filters-bar">
                    <select class="filter-select" id="sortSelect" onchange="applyFilters()">
                        <option value="">🔽 Сортировка</option>
                        <option value="price_asc">Цена: по возрастанию</option>
                        <option value="price_desc">Цена: по убыванию</option>
                        <option value="name_asc">Название: А-Я</option>
                        <option value="name_desc">Название: Я-А</option>
                    </select>
                    <select class="filter-select" id="sizeSelect" onchange="applyFilters()">
                        <option value="">📏 Все размеры</option>
                    </select>
                </div>
                <div class="products-grid" id="productsGrid"></div>
            </div>

            <!-- Карточка товара -->
            <div class="view" id="view-product" style="display: none;">
                <div id="productDetail"></div>
            </div>

            <!-- Корзина -->
            <div class="view" id="view-cart" style="display: none;">
                <div id="cartContent"></div>
            </div>

            <!-- Оформление заказа -->
            <div class="view" id="view-checkout" style="display: none;">
                <div id="checkoutContent"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
