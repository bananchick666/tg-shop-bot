<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <button class="header-btn back-btn" id="backBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1 class="header-title" id="headerTitle">🛍 Shop</h1>
            <button class="header-btn cart-btn" id="cartBtn" style="position:relative;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </header>

        <!-- Контент -->
        <main class="content">
            <div class="view" id="view-categories"></div>
            <div class="view" id="view-products" style="display:none;"></div>
            <div class="view" id="view-product" style="display:none;"></div>
            <div class="view" id="view-cart" style="display:none;"></div>
            <div class="view" id="view-checkout" style="display:none;"></div>
            <div class="view" id="view-wheel" style="display:none;"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
